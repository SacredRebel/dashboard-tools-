<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- URL guard: relative CSS/JS below only resolve when the URL ends in "/" or ".html". Keep this first. -->
  <script>if (!/\/$|\.html$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);</script>
  <title>Canopy Reforest · Dashboard Tools gallery</title>
  <meta name="description" content="Organic reforestation tracker: leafy hero, forest metrics band, and colour-blocked tiles. Sample data.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="../_shared/base.css">
  <link rel="stylesheet" href="../_shared/fx/fx.css">
  <link rel="stylesheet" href="../_shared/dense-pages.css">
  <link rel="stylesheet" href="style.css">
  <script src="../_shared/frame.js"></script>
  <script src="../_shared/dense-pages.js"></script>
  <script type="module" src="../_shared/fx/index.js"></script>
  <script src="../_vendor/motion@12.23.12/motion.js"></script>
</head>
<body>
  <div class="cr" data-cr>
    <div class="cr-grain" aria-hidden="true"></div>

    <header class="cr-top">
      <a class="cr-brand" href="#/overview" aria-label="Canopy home"><span data-icon="leaf"></span>Canopy</a>
      <nav class="cr-nav" aria-label="Main">
        <a href="#/overview">Overview</a>
        <a href="#/tasks">Tasks</a>
        <a href="#/sites">Sites</a>
        <a href="#/settings">Settings</a>
      </nav>
      <button class="cr-iconbtn" type="button" aria-label="Notifications" data-bell><span data-icon="bell"></span></button>
    </header>

    <main class="cr-main" data-main>
      <div data-page-panel="overview" class="cr-overview">
        <section class="cr-hero" aria-labelledby="cr-h1">
          <div class="cr-hero-split" aria-hidden="true"></div>
          <img class="cr-hero-leaves" src="media/leaves@2x.webp" srcset="media/leaves.webp 1x, media/leaves@2x.webp 2x" width="1280" height="720" alt="" decoding="async">
          <div class="cr-hero-copy">
            <p class="cr-eyebrow">Season 4 · <span data-site-name></span></p>
            <h1 id="cr-h1">Regrow<br>the ridge</h1>
            <p class="cr-lede" data-lede></p>
            <div class="cr-hero-actions">
              <button class="cr-cta" type="button" data-log>Log a planting</button>
              <div class="cr-seg" role="group" aria-label="Site" data-sites></div>
            </div>
          </div>
        </section>

        <section class="cr-band" aria-label="Site figures" data-band></section>

        <div class="cr-tiles">
          <section class="cr-tile green" aria-labelledby="cr-sp-h">
            <span class="cr-badge"><span data-icon="leaf"></span></span>
            <h2 id="cr-sp-h">Species mix</h2>
            <ul class="cr-species" data-species></ul>
          </section>
          <section class="cr-tile brown" aria-labelledby="cr-gr-h">
            <span class="cr-badge dark"><span data-icon="trendUp"></span></span>
            <h2 id="cr-gr-h">Trees planted by month</h2>
            <div data-growth></div>
          </section>
          <section class="cr-tile clay" aria-labelledby="cr-so-h">
            <span class="cr-badge"><span data-icon="drop"></span></span>
            <h2 id="cr-so-h">Soil moisture</h2>
            <div class="cr-soil" data-soil></div>
          </section>
          <section class="cr-tile scene" aria-labelledby="cr-sc-h">
            <img class="cr-scene-img" src="media/forest.webp" width="900" height="900" alt="Sunlit forest floor at the active site (sample art)" decoding="async">
            <div class="cr-scene-cap"><h2 id="cr-sc-h" data-scene-title></h2><p data-scene-note></p></div>
          </section>
          <section class="cr-tile dark" aria-labelledby="cr-ta-h">
            <span class="cr-badge dark"><span data-icon="list"></span></span>
            <h2 id="cr-ta-h">This week</h2>
            <ul class="cr-tasks" data-tasks></ul>
          </section>
          <section class="cr-tile tan" aria-labelledby="cr-vo-h">
            <span class="cr-badge hex"><span data-icon="users"></span></span>
            <h2 id="cr-vo-h">Volunteer crews</h2>
            <ul class="cr-crews" data-crews></ul>
          </section>
        </div>
      </div>
    </main>

    <div class="cr-toast" data-toast hidden role="status"></div>
    <p class="db-sample cr-foot">Sample data · fictional</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
