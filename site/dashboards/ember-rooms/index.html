    <symbol id="er-snow" viewBox="0 0 24 24"><path d="M12 2v20M3.3 7l17.4 10M20.7 7 3.3 17M9 4l3 3 3-3M9 20l3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>

    <symbol id="er-fan" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5" fill="currentColor"/><path d="M12 10.5C12 6 10 3 7 4s-1 5 3.5 7M13.5 12c4.5 0 7.5-2 6.5-5s-5-1-7 3.5M12 13.5c0 4.5 2 7.5 5 6.5s1-5-3.5-7M10.5 12C6 12 3 14 4 17s5 1 7-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>

    <symbol id="er-power" viewBox="0 0 24 24"><path d="M12 3v9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>

  <div class="er" data-db-app>
    <div class="er-board" data-board data-ref="frame">
      <div class="er-title-tab" data-ref="title">
        <b>Ember Rooms</b>
        <small>Indoor control centre</small>
      </div>

      <aside class="er-rail" data-ref="sidebar" aria-label="Home systems">
        <nav class="er-rail-pill" aria-label="Primary">
          <a href="#/overview" class="er-rail-btn" aria-current="page" aria-label="Overview"><svg><use href="#er-home"/></svg></a>
          <a href="#/rooms" class="er-rail-btn" aria-label="Rooms"><svg><use href="#er-bulb"/></svg></a>
          <a href="#/devices" class="er-rail-btn" aria-label="Climate"><svg><use href="#er-snow"/></svg></a>
          <a href="#/energy" class="er-rail-btn" aria-label="Energy"><svg><use href="#er-tv"/></svg></a>
          <a href="#/settings" class="er-rail-btn" aria-label="Security"><svg><use href="#er-lock"/></svg></a>
          <a href="#/devices" class="er-rail-btn" aria-label="Airflow"><svg><use href="#er-fan"/></svg></a>
          <a href="#/rooms" class="er-rail-btn" aria-label="Scenes"><svg><use href="#er-music"/></svg></a>
        </nav>
      </aside>

      <label class="er-search" data-ref="search">
        <span class="vh">Search rooms and scenes</span>
        <svg aria-hidden="true"><use href="#er-search"/></svg>
        <input type="search" placeholder="Search rooms, scenes…" autocomplete="off" data-q>
      </label>

      <div class="er-tools" data-ref="actions">
        <button type="button" class="er-orb" aria-label="Undo" data-undo><svg><use href="#er-undo"/></svg></button>
        <button type="button" class="er-orb" aria-label="Redo" data-redo><svg><use href="#er-redo"/></svg></button>
        <a class="er-orb" href="#/settings" aria-label="Settings"><svg><use href="#er-gear"/></svg></a>
      </div>

      <span class="er-cord" aria-hidden="true"></span>

      <div class="er-hero" data-hero data-ref="lamp">
        <img class="er-hero-poster" src="media/hero-poster.png" alt="" width="512" height="640">
        <canvas data-hero-canvas aria-label="A 3D pale dome pendant lamp. Drag to turn it." role="img"></canvas>
      </div>

      <main class="er-main" id="main">
        <section data-db-page="overview" class="er-over">
          <div class="er-rings" data-ref="ring" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <div class="er-orbit" data-orbit></div>

          <p class="er-frac num" data-frac data-ref="readout">12/7</p>
          <button type="button" class="er-power" data-power data-ref="power" aria-pressed="true" aria-label="Toggle bedroom light"><svg><use href="#er-power"/></svg></button>

          <div class="er-left" data-ref="controls">
            <p class="er-light-label">Bedroom ceiling</p>
            <label class="er-intensity">
              <span>Intensity</span>
              <output class="num" data-bright-out>68%</output>
              <input type="range" min="0" max="100" value="68" data-bright aria-valuetext="68 percent">
            </label>
            <div class="er-sched">
              <span class="er-k">Schedule</span>
              <button type="button" class="er-time" data-start>8:30 AM</button>
              <button type="button" class="er-time" data-end>4:30 PM</button>
            </div>
            <div class="er-donut" data-ref="donut" data-gauge aria-hidden="true">
              <svg viewBox="0 0 100 100">
                <circle class="er-donut-track" cx="50" cy="50" r="36"/>
                <circle class="er-donut-arc" data-gauge-arc cx="50" cy="50" r="36"/>
              </svg>
              <span class="er-donut-well"><svg><use href="#er-bulb"/></svg></span>
            </div>
          </div>

          <article class="er-tile er-chart" data-ref="card-a" aria-labelledby="er-ch1">
            <h2 id="er-ch1">Usage</h2>
            <p class="er-tile-meta"><span class="num" data-usage>42</span> kWh · 7 days</p>
            <div class="er-spark" data-chart="usage"></div>
          </article>
          <article class="er-tile er-chart er-chart-2" data-ref="card-b" aria-labelledby="er-ch2">
            <h2 id="er-ch2">Peak</h2>
            <p class="er-tile-meta"><span class="num" data-peak>9.4</span> kW · today</p>
            <div class="er-spark" data-chart="peak"></div>
          </article>
          <article class="er-tile er-video" data-ref="video">
            <img src="media/room.webp" alt="Dim living room preview" width="1280" height="720">
            <button type="button" class="er-play" data-play aria-pressed="false" aria-label="Play room preview"><svg><use href="#er-play"/></svg></button>
            <p>Simulated room view</p>
          </article>
        </section>
        <section data-db-page="rooms" class="er-page" hidden></section>
        <section data-db-page="devices" class="er-page er-climate" hidden></section>
        <section data-db-page="energy" class="er-page" hidden></section>
        <section data-db-page="settings" class="er-page" hidden></section>
      </main>
      <p class="er-sample db-sample">Sample data · fictional home · not a live system</p>
    </div>
  </div>
  <div class="er-toast" data-toast role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
  <script type="module" src="lamp.js"></script>
</body>
</html>
