<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- URL guard: relative CSS/JS below only resolve when the URL ends in "/" or ".html". Keep this first. -->
  <script>if (!/\/$|\.html$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);</script>
  <title>Ember Rooms · Dashboard Tools gallery</title>
  <meta name="description" content="Soft neumorphic indoor lighting console with pendant lamp photo, orbiting rooms, intensity slider and room camera. Sample data.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../_shared/base.css">
  <link rel="stylesheet" href="../_shared/fx/fx.css">
  <link rel="stylesheet" href="../_shared/dense-pages.css">
  <link rel="stylesheet" href="style.css">
  <script src="../_shared/frame.js"></script>
  <script src="../_shared/dense-pages.js"></script>
  <script type="module" src="../_shared/fx/index.js"></script>
  <script src="../_vendor/motion@12.23.12/motion.js"></script>
</head>
<body>
  <div class="er" data-db-app>
    <aside class="er-rail" aria-label="Home systems">
      <nav class="er-railnav" aria-label="Primary">
        <a href="#/overview" class="er-railbtn" aria-current="page" aria-label="Overview"><span data-icon="home"></span></a>
        <a href="#/rooms" class="er-railbtn" aria-label="Rooms"><span data-icon="bulb"></span></a>
        <a href="#/devices" class="er-railbtn" aria-label="Devices"><span data-icon="snow"></span></a>
        <a href="#/energy" class="er-railbtn" aria-label="Energy"><span data-icon="tv"></span></a>
        <a href="#/settings" class="er-railbtn" aria-label="Security"><span data-icon="lock"></span></a>
        <a href="#/devices" class="er-railbtn" aria-label="Airflow"><span data-icon="fan"></span></a>
        <a href="#/settings" class="er-railbtn" aria-label="Settings"><span data-icon="settings"></span></a>
      </nav>
      <button type="button" class="er-railbtn" aria-label="Menu" data-menu><span data-icon="menu"></span></button>
    </aside>

    <div class="er-shell">
      <header class="er-top">
        <label class="er-search">
          <span class="vh">Search rooms and scenes</span>
          <span data-icon="search" aria-hidden="true"></span>
          <input type="search" placeholder="Search rooms, scenes…" autocomplete="off" data-q>
        </label>
        <a class="er-brand" href="#/overview">Ember Rooms</a>
        <div class="er-tools">
          <button type="button" class="er-orb" aria-label="Undo" data-undo><span data-icon="refresh"></span></button>
          <button type="button" class="er-orb" aria-label="Redo" data-redo><span data-icon="arrowRight"></span></button>
          <a class="er-orb er-orb-link" href="#/settings" aria-label="Settings"><span data-icon="settings"></span></a>
        </div>
      </header>

      <p class="er-note" data-note aria-live="polite"></p>

      <main class="er-main-host" data-main>
        <div class="er-overview" data-page-panel="overview">
          <div class="er-well">
            <div class="er-side-l">
              <section class="er-panel er-reveal" aria-labelledby="er-int-h">
                <div class="er-panelhead">
                  <h2 id="er-int-h">Intensity</h2>
                  <output class="num er-chip" data-bright-out>68%</output>
                </div>
                <label class="er-slider">
                  <span class="vh">Light intensity</span>
                  <input type="range" min="0" max="100" value="68" data-bright>
                </label>
              </section>

              <section class="er-panel er-reveal" aria-labelledby="er-sch-h">
                <h2 id="er-sch-h">Schedule</h2>
                <div class="er-sched">
                  <div>
                    <span data-icon="clock" aria-hidden="true"></span>
                    <div>
                      <span class="er-k">Starts</span>
                      <button type="button" class="er-time" data-start>8:30 AM</button>
                    </div>
                  </div>
                  <span class="er-sched-line" aria-hidden="true"></span>
                  <div>
                    <span data-icon="clock" aria-hidden="true"></span>
                    <div>
                      <span class="er-k">Ends</span>
                      <button type="button" class="er-time" data-end>4:30 PM</button>
                    </div>
                  </div>
                </div>
              </section>

              <section class="er-panel er-dialcard er-reveal" aria-labelledby="er-dial-h">
                <h2 id="er-dial-h" class="vh">Brightness dial</h2>
                <div class="er-dialwrap">
                  <div class="er-dial" data-dial></div>
                  <button type="button" class="er-dial-bulb" aria-label="Toggle accent scene" data-scene>
                    <span data-icon="bulb"></span>
                  </button>
                </div>
                <p class="er-muted er-pilllabel" data-dial-note>Scene · Soft amber</p>
              </section>
            </div>

            <section class="er-stage er-reveal" aria-labelledby="er-stage-h">
              <h2 id="er-stage-h" class="vh">Pendant lighting</h2>
              <div class="er-orbits" data-orbits>
                <i class="er-ring r1" aria-hidden="true"></i>
                <i class="er-ring r2" aria-hidden="true"></i>
                <i class="er-ring r3" aria-hidden="true"></i>
                <div class="er-rooms" role="group" aria-label="Rooms" data-rooms></div>
                <div class="er-lamp" data-lamp>
                  <img class="er-lampphoto er-ambient" src="media/pendant.webp" width="1024" height="1024" alt="" decoding="async">
                  <span class="er-lampglow" aria-hidden="true"></span>
                </div>
                <div class="er-readout">
                  <p class="er-frac num"><span data-on>7</span><span class="er-slash">/</span><span data-total>12</span></p>
                  <p class="er-lightlabel">LIGHT</p>
                  <button type="button" class="er-pwr" aria-pressed="true" data-pwr aria-label="Room lights power">
                    <span data-icon="power"></span>
                  </button>
                </div>
              </div>
              <p class="er-roomhint" data-roomhint></p>
            </section>

            <div class="er-side-r">
              <section class="er-panel er-reveal" aria-labelledby="er-en-h">
                <div class="er-panelhead">
                  <h2 id="er-en-h">Usage</h2>
                  <div class="er-seg" role="group" aria-label="Usage range" data-range>
                    <button type="button" data-v="day" aria-pressed="true">Day</button>
                    <button type="button" data-v="week" aria-pressed="false">Week</button>
                  </div>
                </div>
                <div data-usage></div>
                <p class="er-empty" data-usage-empty hidden>No usage samples for this filter.</p>
              </section>

              <section class="er-panel er-reveal" aria-labelledby="er-trend-h">
                <h2 id="er-trend-h">Trend</h2>
                <div data-trend></div>
              </section>

              <section class="er-panel er-video er-reveal" aria-labelledby="er-vid-h">
                <div class="er-panelhead">
                  <h2 id="er-vid-h">Room view</h2>
                  <span class="er-live" data-live>Live</span>
                </div>
                <div class="er-feed" data-feed></div>
                <p class="er-err" data-feed-err hidden>Camera offline. Pick another room.</p>
              </section>
            </div>
          </div>
          <p class="db-sample">Sample data · fictional home · Ember Rooms</p>
        </div>
      </main>
    </div>
  </div>
  <div class="er-toast" data-toast hidden role="status"></div>
  <script src="app.js"></script>
</body>
</html>
