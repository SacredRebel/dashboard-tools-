<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- URL guard: relative CSS/JS below only resolve when the URL ends in "/" or ".html". Keep this first. -->
  <script>if (!/\/$|\.html$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);</script>
  <title>Meridian Labs · Dashboard Tools gallery</title>
  <meta name="description" content="Soft health diagnostics with test cards, SVG DNA helix, vitamin grid and week schedule. Sample data.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../_shared/base.css">
  <link rel="stylesheet" href="../_shared/fx/fx.css">
  <link rel="stylesheet" href="../_shared/dense-pages.css">
  <link rel="stylesheet" href="style.css">
  <script src="../_shared/frame.js"></script>
  <script src="../_shared/dense-pages.js"></script>
  <script type="module" src="../_shared/fx/index.js"></script>
  <script src="../_vendor/motion@12.23.12/motion.js"></script>
</head>
<body>
  <div class="me" data-db-app>
    <header class="me-top">
      <a class="me-brand" href="#" aria-label="Meridian Labs home">
        <span class="me-logo" aria-hidden="true"></span>
        <span>Meridian Labs</span>
      </a>
      <nav class="me-orbnav" aria-label="Primary" data-nav>
        <button type="button" data-v="home" aria-current="page" aria-label="Overview"><span data-icon="grid"></span></button>
        <button type="button" data-v="tests" aria-label="Tests"><span data-icon="file"></span></button>
        <button type="button" data-v="calendar" aria-label="Calendar"><span data-icon="calendar"></span></button>
        <button type="button" data-v="alerts" aria-label="Notifications, new"><span data-icon="bell"></span><i class="me-dot" aria-hidden="true"></i></button>
        <button type="button" data-v="settings" aria-label="Settings"><span data-icon="settings"></span></button>
      </nav>
      <button type="button" class="me-profile" aria-label="Account menu">
        <span class="me-avatar" aria-hidden="true">HO</span>
        <span class="me-who"><b>Hugo Olafsson</b><small>hugo@meridian.example</small></span>
        <span data-icon="chevDown" aria-hidden="true"></span>
      </button>
    </header>

    <main class="me-main">
      <section class="me-tests" aria-labelledby="me-te-h">
        <div class="me-sechead">
          <button type="button" class="me-round" aria-label="Back" data-back><span data-icon="arrowLeft"></span></button>
          <h1 id="me-te-h">Personal Tests and Analysis</h1>
        </div>
        <div class="me-filters" role="group" aria-label="Filter tests" data-filters></div>
        <div class="me-carousel" data-tests tabindex="0" aria-label="Test cards"></div>
        <p class="me-state" data-tests-state aria-live="polite"></p>
      </section>

      <section class="me-dna" aria-labelledby="me-dna-h">
        <h2 id="me-dna-h" class="vh">DNA structure view</h2>
        <div class="me-dnastats">
          <p><b>B</b> Structure</p>
          <p class="num"><b data-angstrom>23.3</b> Angstrom</p>
        </div>
        <div class="me-helix" data-helix aria-hidden="true"><img class="me-dna" src="media/dna.webp" width="720" height="720" alt="" decoding="async"></div>
        <div class="me-dnaorb" role="toolbar" aria-label="DNA tools" data-dnatools>
          <button type="button" aria-label="Heart markers" data-tool="heart" aria-pressed="true"><span data-icon="heart"></span></button>
          <button type="button" aria-label="Activity leads" data-tool="pulse" aria-pressed="false"><span data-icon="activity"></span></button>
          <button type="button" aria-label="Scan frame" data-tool="scan" aria-pressed="false"><span data-icon="expand"></span></button>
        </div>
      </section>

      <section class="me-vits" aria-labelledby="me-vi-h">
        <div class="me-sechead me-sechead-end">
          <h2 id="me-vi-h">Your Vitamin Supplements</h2>
          <button type="button" class="me-round" aria-label="Browse supplements" data-vitnext><span data-icon="arrowRight"></span></button>
        </div>
        <div class="me-vitgrid" data-vits></div>
        <div class="me-pages" role="group" aria-label="Supplement pages" data-vitpages></div>
      </section>
    </main>

    <section class="me-week" aria-labelledby="me-wk-h">
      <div class="me-weekhead">
        <button type="button" class="me-round" aria-label="Previous week" data-wk="-1"><span data-icon="chevLeft"></span></button>
        <h2 id="me-wk-h" data-month></h2>
        <button type="button" class="me-round" aria-label="Next week" data-wk="1"><span data-icon="chevRight"></span></button>
      </div>
      <div class="me-weekstrip" data-week role="list"></div>
      <p class="me-state" data-week-state aria-live="polite"></p>
    </section>

    <p class="db-sample me-foot">Sample data · fictional</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
